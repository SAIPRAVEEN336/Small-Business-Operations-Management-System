{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Alerts</h1>
</div>

{% if alerts %}
<div class="alert-grid">
    {% for alert in alerts %}
    <div class="alert-card alert-{{ alert.severity }}">
        <h3>{{ alert.title }}</h3>
        <p>{{ alert.explanation }}</p>
        <a class="btn btn-primary" href="{{ alert.action_url }}">{{ alert.action_label }}</a>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="empty-state">
    <p>No alerts right now. Nothing needs attention.</p>
</div>
{% endif %}
{% endblock %}
