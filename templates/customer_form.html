{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
</div>

<div class="card">
{% if error %}
<p class="form-error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ action }}">
    <div class="form-field">
        <label>Name<br>
            <input type="text" name="name" value="{{ form.name }}">
        </label>
    </div>
    <div class="form-field">
        <label>Phone<br>
            <input type="text" name="phone" value="{{ form.phone }}">
        </label>
    </div>
    <div class="form-field">
        <label>Email<br>
            <input type="email" name="email" value="{{ form.email }}">
        </label>
    </div>
    <div class="form-field">
        <label>Payment terms (days)<br>
            <input type="number" name="payment_terms_days" min="0" value="{{ form.payment_terms_days }}">
        </label>
    </div>
    <div class="form-field">
        <label>Notes<br>
            <textarea name="notes" rows="3">{{ form.notes }}</textarea>
        </label>
    </div>
    <p>
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-secondary" href="{{ url_for('customers.list_customers') }}">Cancel</a>
    </p>
</form>
</div>
{% endblock %}
